[project]
name = "linkedin-agent"
version = "0.1.0"
description = "Агент за генериране на LinkedIn постове за ИКТ Клъстер – Варна (скелет, без публикуване)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "Pillow>=10.2",
    "PyYAML>=6.0",
    "rich>=13.7",
    "colorama>=0.4.6",
    "textual>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
linkedin-agent = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the REAL configured LLM backend from .env (no mocking) — excluded from the default run (see addopts); run explicitly with `pytest -m live`",
]
# Всичките ~250+ теста освен live-маркираните ползват fake/mock клиенти (виж test_llm_client.py) —
# нарочно, за скорост и детерминизъм. Но точно затова нито един от тях не хвана JSON-retry
# бурята/345-секундния Критик разговор от реално пускане (2026-08-25) — виж
# tests/test_llm_client_live.py. `-m "not live"` тук държи тези тестове изключени по
# подразбиране (не бавят обикновен `pytest`, не изискват .env/мрежа в CI); `pytest -m live`
# ги пуска изрично.
addopts = "-m 'not live'"

[tool.setuptools.package-data]
"src.web" = ["static/*"]
